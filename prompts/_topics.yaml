- topic: AI for Software Development
  description: |
    Generative AI is increasingly being used to assist software developers in various tasks. Some examples include:
    - Code completion and generation: Tools like GitHub Copilot use LLMs to suggest code snippets, complete functions, or even generate entire code blocks based on natural language descriptions.
    - Bug detection and fixing: AI systems can analyze code to identify potential bugs, suggest fixes, or even automatically repair simple issues.
    - Documentation generation: LLMs can help create or improve code documentation by generating summaries, explaining complex functions, or writing API documentation.
    - Code refactoring: AI can suggest ways to improve code structure, readability, and efficiency.

- topic: Harness Engineering
  description: |
    Harness engineering is the practice of designing, composing, and iterating the
    operational scaffold around a foundation model—prompts, tools, memory, permissions,
    orchestration, and evaluation loops—so the resulting agent system behaves reliably
    in a target environment. Prefer work on human-in-the-loop harness engineering and
    observability of agent behavior: how people inspect, steer, debug, and improve the
    harness, and how agent trajectories and decisions are made visible and actionable.
    Relevant work includes:
    - Editable harness artifacts (prompts, tools, skills, memory, workflows, policies)
      that operators or teams change with humans meaningfully in the loop
    - Observability: tracing, failure attribution, monitoring consoles, trajectory
      inspection, and interfaces that reveal why an agent acted as it did
    - Platforms and UIs for composing, inspecting, versioning, or sharing harnesses
    - Methods to evaluate, debug, or repair harness quality from observed behavior
    - Team/ops practices for governing who may change harness components and how
    Prefer papers whose contribution is the harness itself, how people engineer it
    interactively, or how agent behavior is made observable. Deprioritize pure model
    training, novel agent architectures without human oversight/observability, and
    builder-only APIs that do not address configuring, inspecting, or improving the
    harness around a model.

- topic: Human-in-the-Loop Evaluation
  description: |
    Research on evaluation methods that involve humans in assessing AI systems,
    rather than relying only on automatic metrics or LLM-as-judge. Relevant work includes:
    - Expert or crowd annotation protocols for model outputs, agents, or interfaces
    - Preference collection, pairwise comparison, and rating studies with people
    - Hybrid pipelines where humans verify, audit, or calibrate automated judges
    - Benchmarks or studies that measure agreement between human and machine evaluations
    - Methods that keep people meaningfully involved in high-stakes or open-ended eval
    Prefer papers whose core contribution is evaluation methodology involving humans,
    not merely papers that report a small human study as an afterthought.

- topic: Human-AI Collaboration
  description: |
    Research on how people and AI systems work together to accomplish tasks, including
    shared control, complementary strengths, and interactive workflows. Relevant work includes:
    - Co-creation, co-writing, co-coding, or joint decision-making with models or agents
    - Mixed-initiative interfaces where initiative shifts between human and AI
    - Studies of teamwork, role allocation, handoff, and oversight in human-AI teams
    - Designs that preserve human agency while using AI assistance productively
    - Empirical studies of collaborative performance, trust, and failure recovery
    Prefer papers focused on collaborative interaction or teaming, not fully autonomous
    agents evaluated in isolation from people.

- topic: Simulated Users
  description: |
    Research that builds, validates, or uses simulated people (user simulators, persona
    agents, synthetic annotators, or LLM-based stand-ins) to train, evaluate, or study
    interactive AI systems. Relevant work includes:
    - User simulators for dialogue, agents, recommenders, tutoring, or UX evaluation
    - Persona or preference models that stand in for real users in multi-turn settings
    - Methods comparing simulator fidelity against real human behavior or judgments
    - Synthetic user feedback for RLHF, interactive eval, or interaction design
    - Risks and limits of replacing humans with simulated users in evaluation
    Prefer papers whose contribution centers on simulating users or human feedback,
    not papers that only mention personas casually.
