name: Fetch paper metadata, generate report, and update reports index

on:
  schedule:
    # GitHub Actions cron uses UTC. 12:00 UTC is 20:00 Beijing time (UTC+8),
    # safely outside DeepSeek's 09:00-12:00 and 14:00-18:00 peak windows.
    - cron: '0 12 * * 5' # Weekly Friday run at 20:00 Beijing time
  workflow_dispatch: # Allows manual trigger

jobs:
  fetch-generate-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Commit and push the generated reports
      id-token: write # Request GitHub OIDC tokens for Claude Workload Identity Federation

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run the pipeline
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        # Claude authenticates through Workload Identity Federation instead of
        # an API key. These IDs are not secrets; src/llm_client.py exchanges a
        # fresh GitHub OIDC token whenever the SDK needs an access token.
        ANTHROPIC_FEDERATION_RULE_ID: fdrl_011thMZ1CGGLDjvP6NcPiX9r
        ANTHROPIC_ORGANIZATION_ID: 1f5898ef-ac07-48e7-8120-e308d43a5754
        ANTHROPIC_SERVICE_ACCOUNT_ID: svac_018ZDoRGuv3WDuoxjEQsxrxX
        ANTHROPIC_WORKSPACE_ID: wrkspc_01DDZaHJQvZN2j41yiF2zKRk
      run: |
        bash src/fetch_generate_publish.sh

    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'
        git add .
        if [ -n "$(git status --porcelain)" ]; then
          git commit -m 'Update paper metadata, reports, and index'
          git push
        else
          echo "No changes to commit"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
